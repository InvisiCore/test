
name: Build VOIDBREAKER

on:
  workflow_dispatch:
  push:
    paths:
      - 'VOIDBREAKER.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract project
        run: |
          unzip -q VOIDBREAKER.zip -d project

      - name: Build plugin
        run: |
          find project -name build.gradle.kts -print
          DIR=$(dirname "$(find project -name build.gradle.kts | head -n 1)")
          gradle -p "$DIR" clean build

      - uses: actions/upload-artifact@v4
        with:
          name: VOIDBREAKER-JAR
          path: project/**/build/libs/*.jar
